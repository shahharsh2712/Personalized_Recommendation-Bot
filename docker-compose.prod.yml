# Production: bind HTTP on port 80 (use with a VPS + optional domain in Caddyfile).
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  web:
    ports: []  # only reachable via Caddy on the Docker network

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
