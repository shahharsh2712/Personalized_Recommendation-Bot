{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
    <div class="card shadow-sm p-4">
        <h1 class="mb-4">Welcome to Product Recommendations!</h1>
        <a href="{{ url_for('register') }}" class="btn btn-primary">Register New User</a>
        {% if session.get('user_email') %}
            <a href="{{ url_for('profile', email=session.get('user_email')) }}" class="btn btn-secondary mt-2">View Profile</a>
            <a href="{{ url_for('logout') }}" class="btn btn-danger mt-2">Logout</a>
        {% else %}
            <a href="{{ url_for('login') }}" class="btn btn-secondary mt-2">Login</a>
        {% endif %}
    </div>
{% endblock %}
